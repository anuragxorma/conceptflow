# Runs the tests, the documentation build and the linter on every push and
# pull request, and once a week, so that a new release of a dependency
# (scikit-learn, NumPy, pandas, ...) that breaks ConceptFlow is noticed.
name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python }}, scikit-learn ${{ matrix.sklearn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            sklearn: "1.6.1"  # oldest version the estimator checks support
          - python: "3.14"
            sklearn: "latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Graphviz (for the Graphviz rendering tests)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install ConceptFlow
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pin scikit-learn
        if: matrix.sklearn != 'latest'
        run: pip install "scikit-learn==${{ matrix.sklearn }}"
      - name: Run the tests
        run: pytest -q

  oldest-scikit-learn:
    # scikit-learn 1.5 is the oldest version ConceptFlow supports; its
    # estimator checks predate the tags API, so those tests are left out.
    name: Python 3.12, scikit-learn 1.5.2 (without estimator checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ConceptFlow
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest "scikit-learn==1.5.2"
      - name: Run the tests
        run: >
          pytest -q
          --ignore=tests/test_check_estimator.py
          --ignore=tests/test_sklearn_compatibility.py
          --ignore=tests/test_docs_examples.py

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ConceptFlow with the documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build the documentation
        run: mkdocs build --strict

  other-platforms:
    # File paths, encodings, and the native dependencies (python-sat, z3)
    # on macOS and Windows. Graphviz and LaTeX are not installed there, so
    # the rendering tests that need them are skipped.
    name: ${{ matrix.os }}, Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ConceptFlow
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the tests
        run: pytest -q

  browser:
    # The interactive (D3) pages in headless Firefox: drawing, labels,
    # clicks, navigation, downloads and notebook embedding.
    name: Interactive pages in Firefox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ConceptFlow, Playwright and Firefox
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest playwright
          playwright install --with-deps firefox
      - name: Run the browser tests
        env:
          CONCEPTFLOW_BROWSER_TESTS: required
        run: pytest -q tests/test_browser.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests examples benchmarks
