[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conceptflow"
dynamic = ["version"]
description = "A scikit-learn compatible Formal Concept Analysis framework."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Anurag Sharma", email = "sharma@cs.uni-kassel.de" }
]
keywords = [
    "formal-concept-analysis",
    "fca",
    "scikit-learn",
    "concept-lattice",
    "conceptual-scaling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.5",
    "networkx",
    # dimflux_layout uses DimFlux's pipeline classes directly, not only its
    # public plot(), so stay within the tested minor version.
    "dim-flux>=1.0.11,<1.1",
]

[project.optional-dependencies]
dev = [
    # The check_estimator tests use the scikit-learn >= 1.6 API.
    "scikit-learn>=1.6",
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/anuragxorma/conceptflow"
Repository = "https://github.com/anuragxorma/conceptflow"
Issues = "https://github.com/anuragxorma/conceptflow/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "conceptflow._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
