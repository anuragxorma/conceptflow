[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "conceptflow"
module-root = "src"

[project]
name = "conceptflow"
version = "0.1.1"
description = "A scikit-learn compatible Formal Concept Analysis framework."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Anurag Sharma", email = "sharma@cs.uni-kassel.de" }
]
keywords = [
    "formal-concept-analysis",
    "fca",
    "scikit-learn",
    "concept-lattice",
    "conceptual-scaling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.2",
    "networkx",
    "sympy",
    "z3-solver",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/anuragxorma/conceptflow"
Repository = "https://github.com/anuragxorma/conceptflow"
Issues = "https://github.com/anuragxorma/conceptflow/issues"


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
